services:
  # Backend Node.js service (Scalable)
  backend:
    image: aotms_lms-1-backend:latest
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000"
    env_file:
      - ./Backend/.env
    restart: always

  # NGINX Load Balancer (Routes API traffic across scaled backend replicas)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always
